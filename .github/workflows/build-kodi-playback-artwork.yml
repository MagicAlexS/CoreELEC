name: Build Kodi playback artwork fix

on:
  push:
    branches:
      - codex/fix-playback-state-artwork
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kodi:
    name: Kodi package for Amlogic-ng
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PROJECT: Amlogic-ce
      DEVICE: Amlogic-ng
      ARCH: arm
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Create artifact directory
        run: mkdir -p artifacts

      - name: Free known preinstalled SDK space and check disk
        shell: bash
        run: bash .github/scripts/prepare-runner.sh 2>&1 | tee artifacts/preflight.log

      - name: Set up Go 1.22
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.22.12
          cache: false

      - name: Install CoreELEC Jammy build dependencies
        shell: bash
        run: bash .github/scripts/install-build-deps.sh 2>&1 | tee artifacts/dependencies.log

      - name: Verify source, patch, and target
        shell: bash
        run: bash .github/scripts/check-build-inputs.sh 2>&1 | tee artifacts/source-check.log

      - name: Build Kodi package
        timeout-minutes: 300
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT=Amlogic-ce DEVICE=Amlogic-ng ARCH=arm ./scripts/build kodi 2>&1 | tee artifacts/build.log

      - name: Collect kodi.bin and build manifest
        if: success()
        shell: bash
        run: python3 .github/scripts/collect-kodi-artifact.py --output-dir artifacts

      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coreelec-kodi-amlogic-ng-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
